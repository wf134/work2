<body>
    <script>
        for(let i=1;i<=8;i++){
            let row='';
            if(i%2==0){
                for(let j=1;j<=8;j++){
                   if(j%2==0){
                        row+=' ';
                   }
                   else{
                        row+='#';
                   }
                }
            }
            else{
                for(let j=1;j<=8;j++){
                   if(j%2==0){
                        row+='#';
                   }
                   else{
                        row+=' ';
                   }
                }
            }
            console.log(row);
        }
            
    </script>
